<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#040929">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroupMatch</title>
    <!--
      OG-разметка для корня. groupmatch.app без пути — основная ссылка для
      шеринга, и до этого превью у неё не было вовсе.

      Тексты дословно из promo.html: они отревьюены, и две карточки на один
      продукт не должны описывать его по-разному. Отличается только og:url —
      здесь корень, а не /promo.

      Оговорка: этот HTML отдаётся на все SPA-маршруты (catch-all в
      vercel.json), поэтому og:url у /signin или /pricing тоже будет корнем.
      Для приватных маршрутов это безразлично — они закрыты в robots.txt.
    -->
    <meta name="description" content="GroupMatch собирает свободное время всех участников в общую сетку и показывает окна, где людей больше всего. Часовые пояса считает сам.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="GroupMatch">
    <meta property="og:url" content="https://groupmatch.app/">
    <meta property="og:title" content="GroupMatch — общее время для встречи без переписок">
    <meta property="og:description" content="Общая сетка свободного времени группы. Pro на 3 месяца бесплатно">
    <meta property="og:image" content="https://groupmatch.app/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="GroupMatch — логотип и подпись «планирование встреч»">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
