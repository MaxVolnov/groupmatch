server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Заголовки безопасности ────────────────────────────────────────────────
    #
    # Те же три, что и в vercel.json. Файл этот в проде не собирается и лежит
    # как заготовка на случай ухода с Vercel — но нужен он будет в день, когда
    # разбираться некогда, и «здесь заголовков нет, потому что руки не дошли»
    # окажется тихим понижением защиты ровно в этот момент.
    #
    # ⚠️ ПРО ПОВТОР НИЖЕ. add_header наследуется в location ТОЛЬКО если в самом
    # location нет ни одного своего add_header. Один add_header в блоке
    # отменяет все унаследованные разом. Поэтому в блоке статики, где стоит свой
    # Cache-Control, эти три строки продублированы. Удалять дубль нельзя — он не
    # избыточный, без него .js и .css поедут без заголовков.
    #
    # always: иначе add_header применяется только к 2xx/3xx, и страницы ошибок
    # остаются без X-Frame-Options.
    #
    # CSP тут нет намеренно — см. комментарий в api/og/routing.test.ts.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: все маршруты → index.html
    #
    # ⚠️ Расхождение с vercel.json, известное и не закрытое: там /promo, /legal
    # и /about переписаны на отдельные статические страницы, а /join/{token} для
    # краулеров уходит в edge-функцию, которой здесь нет и быть не может.
    # Разбор — docs/prod-runbook.md, «Запасной путь для фронтенда».
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика с кэшем
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Повтор, а не копипаста: см. предупреждение выше.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Healthcheck
    #
    # default_type, а не add_header Content-Type: во-первых, add_header для
    # Content-Type работает не всегда (nginx выставляет его сам), во-вторых —
    # любой add_header здесь отменил бы унаследованные заголовки безопасности.
    location /health {
        default_type text/plain;
        return 200 "ok";
    }
}
