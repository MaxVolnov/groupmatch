name: CI

on:
  # Все ветки без исключений. Раньше стояло [main, develop, 'feature/**'], и
  # ветки с любым другим префиксом ехали без единой проверки: PR из пяти
  # коммитов на chore/-ветке не проверялся ни разу за всё время жизни.
  #
  # Да, вместе с pull_request это даёт два прогона на пуш в ветку с открытым
  # PR: concurrency их не схлопывает, потому что github.ref у push и у
  # pull_request разный (refs/heads/x против refs/pull/N/merge). Оставлено
  # намеренно. Сужение push обратно до [main, develop] убирает дубль, но
  # возвращает ветки без проверок — код, ещё не оформленный в PR, не
  # проверяется вовсе. Непроверенная ветка дороже лишнего прогона.
  #
  # Стоимость дубля по трафику к Maven Central снята с другой стороны — тем,
  # что кэш теперь пишется и с develop (см. cache-read-only ниже): прогоны
  # почти всегда идут по тёплому кэшу и до Central не доходят.
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect changed paths ────────────────────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              # legalFacts.test.ts сверяет числа в оферте с этими константами.
              # Без них правка лимита или срока триала не запускала бы фронтовые
              # тесты, и расхождение уехало бы в прод незамеченным.
              - 'backend/src/main/java/com/groupmatch/domain/Plan.java'
              - 'backend/src/main/java/com/groupmatch/service/TrialService.java'

  # ─── Dockerfile ─────────────────────────────────────────────────────────────
  # Файл лежит в двух местах: в корне (оттуда его берёт Timeweb App Platform)
  # и в backend/ (исторический путь, на него смотрит cd.yml). Разъехавшиеся
  # копии — это деплой, который собирает не то, что проверял CI.
  dockerfile-sync:
    name: Dockerfile copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare root and backend Dockerfile
        run: |
          if ! cmp -s Dockerfile backend/Dockerfile; then
            echo "::error::Dockerfile и backend/Dockerfile разошлись — они обязаны совпадать."
            diff -u Dockerfile backend/Dockerfile || true
            exit 1
          fi

  # ─── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — build & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: groupmatch_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: devpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d groupmatch_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Версия Gradle берётся из враппера, а не задаётся здесь. Два
          # источника правды о версии — это расхождение локальной сборки с CI,
          # которое всплывает в самый неудобный момент.
          #
          # По умолчанию действие пишет кэш только с дефолтной ветки, а читают
          # его все остальные. У нас работа месяцами копится в develop, и все
          # её прогоны тянули зависимости из Maven Central заново — прямой
          # вклад в те самые 429. Теперь develop пишет кэш наравне с main.
          #
          # Feature-ветки остаются на чтении: писать кэш с каждой ветки значит
          # забивать десятигигабайтную квоту репозитория снимками, которые
          # никому больше не пригодятся, и вытеснять ими полезные.
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Повтор висит только здесь и только на сетевом отказе.
      #
      # Почему здесь: на этом шаге впервые резолвится весь classpath Spring
      # Boot, и именно он ловит 429, когда лимит Maven Central выбирают чужие
      # сборки с того же диапазона адресов раннера.
      #
      # Почему по содержимому лога, а не «три попытки на любую ошибку»: слепой
      # повтор превращает сломанную компиляцию в три прогона вместо одного и
      # растягивает обратную связь на минуты. Ошибка в коде падает с первой
      # попытки — повторяется только то, что похоже на сеть.
      #
      # Шаг тестов не повторяется намеренно: упавший тест обязан упасть, а не
      # получить ещё две попытки. Остаточный риск известен — 429 может прийти
      # и на резолве testRuntimeClasspath; тогда сборка упадёт, как падала
      # раньше. Маскировать флаки в тестах ради этого случая — плохой размен.
      - name: Compile
        run: |
          set -o pipefail
          log="$(mktemp)"
          for attempt in 1 2 3; do
            if ./gradlew compileJava compileTestJava 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -qiE '429|too many requests|could not (get|head|resolve)|connection (reset|refused|timed out)|read timed out|premature end of' "$log"; then
              echo "::error::Сборка упала не из-за сети — повторять нечего."
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 20))
              echo "::warning::Попытка ${attempt}: сетевой отказ при резолве зависимостей, повтор через ${wait} с."
              sleep "$wait"
            fi
          done
          echo "::error::Три попытки подряд упали на сетевом отказе."
          exit 1

      # Без --no-daemon: действие само останавливает демон в post-шаге перед
      # сохранением кэша, а до тех пор второй вызов Gradle переиспользует
      # прогретую JVM вместо повторного старта с нуля.
      - name: Run tests
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/groupmatch_test
          SPRING_DATASOURCE_USERNAME: dev
          SPRING_DATASOURCE_PASSWORD: devpass
          SPRING_REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-minimum-256-bits-long-padding-here-x

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html/

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test/

  # ─── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — lint, build & test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080
