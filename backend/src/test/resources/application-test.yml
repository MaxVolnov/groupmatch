spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/groupmatch}
    username: ${SPRING_DATASOURCE_USERNAME:dev}
    password: ${SPRING_DATASOURCE_PASSWORD:devpass}
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 2525
    test-connection: false
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # Нужно MeetingNPlusOneTest, который считает JDBC-запросы на создание
        # встречи. Оверхед на остальных тестах пренебрежимо мал.
        generate_statistics: true

logging:
  level:
    com.groupmatch: WARN
    org.springframework: WARN
    org.flywaydb: WARN

jwt:
  secret: ${JWT_SECRET:test-secret-key-must-be-at-least-256-bits-long-padding-padding}
  expiration:
    access: 900000
    refresh: 1209600000

app:
  cors:
    allowed-origins: http://localhost:3000
  # Бакеты rate-limit'а живут в памяти фильтра и общие на весь дефолтный
  # контекст: все тесты сьюта ходят с 127.0.0.1 и делят один счётчик. При
  # лимите 30 суммы регистраций по классам хватило, чтобы поздние тесты
  # начали получать 429 на ровном месте. Здесь лимит нужен только чтобы не
  # мешать; само поведение проверяется в RateLimitBypassTest, у которого
  # свой контекст и свой низкий лимит.
  rate-limit:
    signup: 500
    signin: 500
    refresh: 500
  cache:
    heatmap-ttl-minutes: 60
  mail:
    from: test@groupmatch-test.io
    base-url: http://localhost:3000
  email-verification:
    token-ttl-hours: 24
  password-reset:
    token-ttl-hours: 1
